<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yandex_Land</title>
    <link rel="stylesheet" href="css/libs.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="header">
    <div class="container">
        <div class="header__container">
            <div class="header__logos">
                <a class="header__logo-ts" href="#">
                    <picture class="img">
                        <source srcset="images/logo_tr_mob.png" media="(max-width: 800px)" />
                        <img src="images/logo_tr.png" alt="Логотип" />
                    </picture>
                </a>
                <a class="header__logo-ya" href="#">
                    <picture class="img">
                        <source srcset="images/logo_ya_mob.png" media="(max-width: 800px)" />
                        <img src="images/logo_ya.png" alt="Логотип" />
                    </picture>
                </a>
                <a class="header__logo-sm" href="#">
                    <picture class="img">
                        <source srcset="images/logo_sm_mob.png" media="(max-width: 800px)" />
                        <img src="images/logo_sm.png" alt="Логотип" />
                    </picture>
                </a>
            </div>
            <nav class="header__nav">
                <ul class="header__menu">
                    <li class="header__item">
                        <a href="#" class="header__link">главная</a>
                    </li>
                    <li class="header__item">
                        <a href="#" class="header__link">правила</a>
                    </li>
                    <li class="header__item">
                        <a href="#" class="header__link">победители</a>
                    </li>
                    <li class="header__item">
                        <a href="#" class="header__link">FAQ</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</header>
    <main class="main">
        <div class="container">
            <section class="hero">
    <h1 class="hero__title title">
        <span class="title__line">Участвуйте в розыгрыше</span>
        <span class="title__line title__line--gold">150 000 рублей</span>
    </h1>
    <button class="hero__btn">и других призов!</button>
    <picture class="hero__img">
        <source srcset="images/hero/banner_mobile.webp" media="(min-width: 1180px)" />
        <img src="images/hero/banner_desc.webp" alt="баннер" />
    </picture>
    <p class="hero__text">
        Акция с 19 декабря 2025 г. по 19 января 2026 г.
    </p>
</section>
        </div>
    </main>
    

    <script src="js/script.js"></script>
</body>

</html>
